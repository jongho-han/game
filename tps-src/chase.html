<style>
/* 레이아웃: 속도계가 중심인 레이싱 포스터. 기울인 표제, 하단 중앙 계기판. */
:root{--ink:#190b1e;--paper:#fff4e0;--accent:#35f0d0;--hot:#ff5b3a;--sun:#ffc23d;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"Rajdhani","IBM Plex Sans KR",sans-serif;color-scheme:dark}
/*CORECSS*/
#menu{background:linear-gradient(90deg,rgba(25,11,30,.65),rgba(25,11,30,0) 62%)}
#logo{font-size:min(17vw,25vh,190px);line-height:.92;color:var(--paper);transform:skewX(-10deg);transform-origin:0 100%;text-shadow:.05em .05em 0 var(--hot)}
#logo em{font-style:normal;display:block;margin-left:.5em;color:var(--accent);text-shadow:.05em .05em 0 var(--ink)}
.go{transform:skewX(-10deg)}.go:hover{transform:skewX(-10deg) translateX(8px)}.go:active{transform:skewX(-10deg) translateX(12px) scale(.97)}
#speedo{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%) skewX(-10deg);display:grid;justify-items:center;gap:3px;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#spd{font:700 clamp(34px,6vw,58px)/.9 var(--mono);font-variant-numeric:tabular-nums}#spd small{font-size:.38em;margin-left:4px;color:var(--accent)}
.bar{width:min(280px,46vw);height:9px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.4)}.bar i{display:block;height:100%;transform-origin:0 50%;background:var(--paper)}
#boostBar i{background:var(--accent)}#hpBar i{background:var(--hot)}
#scoreBox{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(14px,env(safe-area-inset-top,0px));font:700 34px/1 var(--mono);text-shadow:0 2px 0 rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
#scoreBox small{display:block;font:700 15px/1.3 var(--mono);color:var(--accent)}
#mult{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(max(14px,env(safe-area-inset-top,0px)) + 66px);font:400 28px/1 var(--display);color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.6)}
#bossBox{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(440px,52vw);display:grid;gap:4px;text-align:center}
#bossBox .bar{width:100%;height:13px}#bossBar i{background:var(--hot)}#bossName{font:400 18px/1 var(--display);text-shadow:0 2px 0 #000}
#xh{position:absolute;left:0;top:0;width:42px;height:42px;margin:-21px;border:2px solid var(--paper);border-radius:50%;box-shadow:0 0 3px #000}
#xh::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--paper)}
#xh.lock{border-color:var(--sun);border-style:dashed}
#locks{position:fixed;inset:0;pointer-events:none;z-index:1}
.lk{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px;border:3px solid var(--sun);transform-origin:50% 50%}
#lockN{position:absolute;left:50%;top:60%;transform:translateX(-50%);font:700 18px/1 var(--mono);color:var(--sun);text-shadow:0 2px 0 #000}
#banner{position:absolute;left:0;right:0;top:24%;text-align:center;font:400 clamp(32px,7vw,84px)/1.05 var(--display);transform:skewX(-10deg);text-shadow:.05em .05em 0 var(--ink);opacity:0}
#banner small{display:block;font:700 clamp(14px,2vw,20px)/1.4 var(--mono);color:var(--accent);letter-spacing:.1em}
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
@media (pointer:coarse){#speedo{left:auto;right:auto;left:50%;bottom:auto;top:calc(max(14px,env(safe-area-inset-top,0px)) + 46px)}}
</style>

<script>
/*COREJS*/
/* ───── 협곡 추격 ───── */
R.shadowMap.enabled=false;cam.far=1400;
const THEMES=[
 {name:'붉은 협곡',sky:[0x35215e,0xe0653f,0xffc36a],fog:0xd9734f,fd:.0044,sun:new V(.25,.16,-1),sunC:0xfff0b8,sc:0xffc898,grd:0xffb080,a:[0xa63c24,0xd86a33,0xe9a653,0x8e2f28],floor:0xc0663a,river:0},
 {name:'얼음 협곡',sky:[0x123a78,0x69c4e4,0xe3f9ff],fog:0xa7dcea,fd:.0048,sun:new V(-.3,.3,-1),sunC:0xffffff,sc:0xe6f6ff,grd:0xa8cfe2,a:[0x315f9e,0x6fb2d6,0xd9f3fa,0x3d7fb4],floor:0xd0e8f2,river:0},
 {name:'용암 협곡',sky:[0x0c0612,0x3a0f22,0xb5341a],fog:0x531714,fd:.0058,sun:new V(.1,.08,-1),sunC:0xff8a3c,sc:0xff9a68,grd:0x70241a,a:[0x1a1014,0x38191c,0x5a2420,0x241216],floor:0x201013,river:1}
].map(t=>Object.assign(t,{c:{fog:C(t.fog),sc:C(t.sc),grd:C(t.grd),floor:C(t.floor),a:t.a.map(C)}}));
scene.fog=new THREE.FogExp2(THEMES[0].fog,THEMES[0].fd);
const sky=skyDome(...THEMES[0].sky,THEMES[0].sun,THEMES[0].sunC,.6);
const hemi=new THREE.HemisphereLight(0xffd8b8,0xffb080,1.7);scene.add(hemi);
const sunL=new THREE.DirectionalLight(0xffc898,3);sunL.position.set(.3,.7,.6);scene.add(sunL);
let theme=0,themeK=1,themeFrom=0;
function applyTheme(a,b,k){const A=THEMES[a],B=THEMES[b];
  scene.fog.color.copy(A.c.fog).lerp(B.c.fog,k);scene.fog.density=lerp(A.fd,B.fd,k);
  const u=sky.material.uniforms;u.a.value.setHex(A.sky[0]).lerp(C(B.sky[0]),k);u.b.value.setHex(A.sky[1]).lerp(C(B.sky[1]),k);u.c.value.setHex(A.sky[2]).lerp(C(B.sky[2]),k);u.s.value.copy(A.sun).lerp(B.sun,k).normalize();u.sc.value.setHex(A.sunC).lerp(C(B.sunC),k);
  sunL.color.copy(A.c.sc).lerp(B.c.sc,k);hemi.groundColor.copy(A.c.grd).lerp(B.c.grd,k)}

/* 협곡 곡선: s(전진 거리)에서 중심선의 x 위치와 폭 */
const WH=(s)=>17+sin(s*.0031)*4.5+sin(s*.0093+1)*1.5;
const CX=(s)=>sin(s*.0042)*52+sin(s*.0017+2)*80;
function hval(lat,s){ /* 중심선 기준 지형 높이 */
  const w=WH(s),o=abs(lat)-w;
  if(o<0)return 0;
  const n=sin(s*.05+lat*.16)*1.2+sin(s*.13+lat*.31)*.7+sin(s*.021+lat*.05)*3;
  return o<26?pow(o/26,.62)*(46+n*3)+n:46+(o-26)*1.1+n*3;
}
const CHUNK=64,ROWS=9,COLS=20,NCH=11;
const chMat=new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1,metalness:0});
const chunks3=[];
const strataC=new THREE.Color();
function strata(h,lat,s,t0,t1,k){const q=(h*.11+sin(s*.01+lat*.02)*.5);const i=floor(q)&3,f=q-floor(q);const A=THEMES[t0].c.a,B=THEMES[t1].c.a;strataC.copy(A[i]).lerp(B[i],k);const g=.86+.18*sin(q*9);strataC.multiplyScalar(g);return strataC}
function buildChunk(ch,s0){
  ch.s0=s0;const p=ch.pos,c=ch.col,base=CX(s0);let k=0;const t0=themeOf(s0),t1=t0;
  const thm=themeAt(s0);
  for(let r=0;r<=ROWS;r++){const s=s0+r/ROWS*CHUNK,cx=CX(s)-base,w=WH(s);
    for(let i=0;i<=COLS;i++){
      const u=i/COLS*2-1,lat=sign(u)*(abs(u)<.45?abs(u)/.45*(w-.5):(w-.5)+pow((abs(u)-.45)/.55,1.5)*150);
      const h=hval(lat,s)+(abs(lat)<w?0:0);
      p[k*3]=cx+lat;p[k*3+1]=h;p[k*3+2]=-(s-s0);
      const col=abs(lat)<w?(THEMES[thm].c.floor):strata(h,lat,s,thm,thm,0);
      const sh=abs(lat)<w?(.9+.1*sin(s*.3+lat)):1;c[k*3]=col.r*sh;c[k*3+1]=col.g*sh;c[k*3+2]=col.b*sh;k++}
  }
  ch.g.attributes.position.needsUpdate=true;ch.g.attributes.color.needsUpdate=true;ch.g.computeVertexNormals();ch.g.computeBoundingSphere();
}
for(let n=0;n<NCH;n++){
  const g=new THREE.BufferGeometry(),N=(ROWS+1)*(COLS+1),pos=new Float32Array(N*3),col=new Float32Array(N*3),idx=[];
  for(let r=0;r<ROWS;r++)for(let i=0;i<COLS;i++){const a=r*(COLS+1)+i,b=a+1,c=a+COLS+1,d=c+1;idx.push(a,b,c,b,d,c)}
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setIndex(idx);
  const m=new THREE.Mesh(g,chMat);m.frustumCulled=false;scene.add(m);chunks3.push({m,g,pos,col,s0:0})
}
/* 용암 강 */
const lava=new THREE.Mesh(new THREE.PlaneGeometry(24,1400),new THREE.MeshBasicMaterial({color:0xff5a1e,transparent:true,opacity:0,toneMapped:false,depthWrite:false}));lava.rotation.x=-PI/2;lava.position.y=.05;scene.add(lava);
/* 테마 구간 */
const BOSS_EVERY=2200;
function themeOf(s){return theme}
function themeAt(s){return theme}

/* 바이크 */
const bHull=mat(0xf2ede1,{metalness:.4,roughness:.35}),bAcc=mat(0xff4a2c,{metalness:.3,roughness:.4}),bDark=mat(0x24262e,{metalness:.7,roughness:.35});
const P={lat:0,y:1.1,vy:0,vl:0,s:0,hp:100,boost:1,speed:62,tilt:0,pitch:0,alive:true,roll:0,rollDir:0,rollT:0,rollCd:0,inv:0,shotT:0,side:1,scrape:0,g:new THREE.Group(),jump:false,score:0,shown:0,kills:0,mult:1,combo:0,comboT:0,fall:0};
scene.add(P.g);
const bikeBody=pivot(P.g,0,0,0);
box(bHull,bikeBody,0,.1,-.2,.82,.42,2.4);box(bHull,bikeBody,0,.18,-1.65,.6,.3,.9);box(bAcc,bikeBody,0,.28,-2.1,.48,.14,.3);
box(bDark,bikeBody,0,.42,.35,.6,.26,1.1);box(bAcc,bikeBody,0,.25,1,.92,.32,.55);
for(const s of[-1,1]){const q=box(bDark,bikeBody,s*.92,-.05,.2,.5,.34,2.3);box(bAcc,bikeBody,s*1.18,-.02,-.45,.05,.2,1.1,false);box(bDark,bikeBody,s*.92,-.05,-1.15,.32,.2,.45)}
const thrL=sph(glowMat(0x50f5e0),bikeBody,-.92,-.05,1.38,.24,.24,.1,false),thrR=sph(glowMat(0x50f5e0),bikeBody,.92,-.05,1.38,.24,.24,.1,false),under=sph(glowMat(0x50f5e0),bikeBody,0,-.26,-.2,.5,.05,1.2,false);
/* 탑승자 */
const rider=pivot(bikeBody,0,.55,.15);const rs=mat(0x1b2230),rh=mat(0xffc23d,{metalness:.3,roughness:.35});
box(rs,rider,0,.3,-.15,.5,.72,.32).rotation.x=-.7;sph(rh,rider,0,.74,-.62,.21,.21,.24);box(glowMat(0x50f5e0),rider,0,.76,-.84,.28,.09,.04,false);
box(rs,rider,-.34,.18,-.5,.13,.13,.8);box(rs,rider,.34,.18,-.5,.13,.13,.8);box(rs,rider,-.28,-.1,.28,.17,.5,.2);box(rs,rider,.28,-.1,.28,.17,.5,.2);
const scarf=box(bAcc,rider,0,.55,.3,.18,.05,.8,false);
const gunL=box(bDark,bikeBody,-.56,.05,-1.3,.12,.12,.9),gunR=box(bDark,bikeBody,.56,.05,-1.3,.12,.12,.9);
const hoverGlow=new THREE.PointLight(0x50f5e0,20,10,2);hoverGlow.position.set(0,-.3,0);P.g.add(hoverGlow);

/* 월드 좌표 변환: 전진 거리와 좌우 → 카메라 기준 공간 */
const wx=(s,lat)=>CX(s)-CX(P.s)+lat,wz=(s)=>-(s-P.s);
const foes=[],rocks=[],pShots=[],eShots=[],missiles=[],picks=[];
const timers=[],later=(t,f)=>timers.push({t,f});function updTimers(dt){for(let i=timers.length-1;i>=0;i--){const q=timers[i];q.t-=dt;if(q.t<=0){timers.splice(i,1);q.f()}}}
const S={next:60,bossAt:BOSS_EVERY-300,boss:null,lock:[],locking:false,bannerT:0,evt:6};

/* 탄 */
const sGeo=new THREE.BoxGeometry(.12,.12,4.2),sMat=new THREE.MeshBasicMaterial({color:0xfff2b0,toneMapped:false}),sPool=[];
function getS(){let m=sPool.pop();if(!m){m=new THREE.Mesh(sGeo,sMat);m.frustumCulled=false;scene.add(m)}m.visible=true;return m}
const eGeo=new THREE.SphereGeometry(.42,10,8),eMat=new THREE.MeshBasicMaterial({color:0xff3a6a,toneMapped:false}),ePool=[];
function getE(){let m=ePool.pop();if(!m){m=new THREE.Mesh(eGeo,eMat);m.frustumCulled=false;scene.add(m)}m.visible=true;return m}
const mGeo=new THREE.ConeGeometry(.14,.9,8);mGeo.rotateX(-PI/2);const mMat=mat(0xfff4e0);

/* 장애물 */
const rockMat=()=>new THREE.MeshStandardMaterial({color:THEMES[themeOf(P.s+300)].a[0],flatShading:true,roughness:1});
const pillarGeo=new THREE.CylinderGeometry(1.6,3.8,1,7,3);{const p=pillarGeo.attributes.position;for(let i=0;i<p.count;i++){p.setX(i,p.getX(i)+rnd(-.35,.35));p.setZ(i,p.getZ(i)+rnd(-.35,.35))}pillarGeo.computeVertexNormals()}
const bouldGeo=new THREE.DodecahedronGeometry(1,0);const arcGeo=new THREE.TorusGeometry(1,.22,6,12,PI);
const rockPool={};
function addRock(kind,s,lat,o={}){
  let m;const pool=rockPool[kind]||(rockPool[kind]=[]);m=pool.pop();
  if(!m){m=new THREE.Mesh(kind==='pillar'?pillarGeo:kind==='arch'?arcGeo:bouldGeo,rockMat());m.frustumCulled=false;scene.add(m)}
  m.visible=true;m.material.color.copy(THEMES[themeOf(s)].c.a[kind==='arch'?1:0]);
  const q=Object.assign({kind,s,lat,m,r:1.5,h:8,near:false},o);
  if(kind==='pillar'){q.h=rnd(16,34);q.r=rnd(2.4,3.6);m.scale.set(q.r/2.6,q.h,q.r/2.6);m.position.y=q.h/2;m.rotation.y=rnd(TAU)}
  else if(kind==='bould'){q.r=rnd(1.5,2.3);q.h=q.r*1.25;m.scale.setScalar(q.r);m.position.y=q.r*.6;m.rotation.set(rnd(TAU),rnd(TAU),0)}
  else if(kind==='arch'){const w=WH(s);q.r=w;q.gap=o.gap;m.scale.set(w+1,16,6);m.position.y=0;m.rotation.set(0,0,0)}
  rocks.push(q);return q;
}
/* 적 */
const fDark=mat(0x23182b,{metalness:.6,roughness:.4}),fMid=mat(0x543045,{metalness:.5,roughness:.5}),fEye=glowMat(0xff3a6a);
const DEF={raider:{hp:32,r:1.7,score:180},drone:{hp:12,r:1.15,score:90},turret:{hp:38,r:2,score:220},mine:{hp:6,r:1.15,score:60}};
const fPool={};
function buildFoe(t){
  const g=new THREE.Group(),m=fDark.clone(),e={g,m,t};
  if(t==='raider'){box(m,g,0,0,0,1,.5,3);box(fMid,g,0,.2,-1.6,.6,.3,.8);box(fMid,g,-1,0,.2,.5,.3,2.3);box(fMid,g,1,0,.2,.5,.3,2.3);box(fEye,g,0,.42,-.8,.5,.1,.5,false);box(fEye,g,-1,0,1.4,.34,.2,.08,false);box(fEye,g,1,0,1.4,.34,.2,.08,false);sph(fDark,g,0,.8,.3,.3,.3,.3)}
  else if(t==='drone'){sph(m,g,0,0,0,.9,.5,.9);sph(fEye,g,0,0,.72,.26,.26,.2,false);e.ring=new THREE.Mesh(new THREE.TorusGeometry(1.2,.09,6,18),fEye);e.ring.rotation.x=PI/2;g.add(e.ring)}
  else if(t==='turret'){cyl(m,g,0,.5,0,1.5,1);const h=pivot(g,0,1.4,0);sph(m,h,0,0,0,1);box(fMid,h,0,0,-1.3,.34,.34,2);sph(fEye,h,0,.5,-.5,.25,.25,.25,false);e.head=h}
  else if(t==='mine'){sph(m,g,0,0,0,.85);for(let i=0;i<6;i++){const a=i/6*TAU;box(fMid,g,cos(a)*.95,0,sin(a)*.95,.25,.25,.25,false)}e.eye=sph(fEye,g,0,.65,0,.25,.25,.25,false)}
  return e;
}
function spawn(t,s,lat,y,o={}){const pool=fPool[t]||(fPool[t]=[]);let e=pool.pop()||buildFoe(t);const d=DEF[t];const dist=P.s/4000;
  Object.assign(e,{s,lat,y,vs:0,hp:d.hp*(1+dist*.45),r:d.r,score:d.score,tt:rnd(9),atk:rnd(.6,2.2),fl:0,dead:false,dying:0,vy:0,vl:0,ph:rnd(TAU)},o);e.m.emissive.setHex(0);e.g.rotation.set(0,0,0);scene.add(e.g);e.g.visible=true;foes.push(e);return e}
function eFire(wxx,wyy,wzz,sp,dmg,lead=1,dev=.8){
  const tx=P.lat+P.vl*lead*.4+rnd(-dev,dev),ty=P.y+.3,tz=0,dx=tx-wxx,dy=ty-wyy,dz=tz-wzz,l=hypot(dx,dy,dz)||1;
  const m=getE();const q={m,x:wxx,y:wyy,z:wzz,vx:dx/l*sp,vy:dy/l*sp,vz:dz/l*sp,dmg,t:0};m.position.set(wxx,wyy,wzz);eShots.push(q);fxA.emit(wxx,wyy,wzz,0,0,0,1,.1,1,.3,.5);Snd.zap();
}
function updFoes(dt){
  for(let i=foes.length-1;i>=0;i--){
    const e=foes[i];e.tt+=dt;if(e.fl>0){e.fl-=dt;if(e.fl<=0)e.m.emissive.setHex(0)}
