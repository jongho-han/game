<style>
/* 레이아웃: 해질녘 사막 기지의 군용 스텐실 표지판. 전체 화면 3D 위 왼쪽 정렬 메뉴와 계기 HUD. */
:root{--ink:#1a1210;--paper:#f6e7cf;--accent:#ff9d2e;--toxic:#7dff5a;--steel:#3c4048;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"Saira Condensed","IBM Plex Sans KR",sans-serif;color-scheme:dark}
/*CORECSS*/
#menu{background:linear-gradient(90deg,rgba(26,18,16,.72),rgba(26,18,16,0) 65%)}
#logo{font-size:min(16vw,22vh,170px);line-height:.95;color:var(--paper);text-shadow:.04em .04em 0 var(--ink)}
#logo em{font-style:normal;color:var(--accent);display:block}
.bar{height:14px;background:rgba(0,0,0,.55);border:2px solid rgba(246,231,207,.65);transform:skewX(-14deg);overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:0 50%;background:var(--paper)}
.lbl{font:700 13px/1 var(--mono);letter-spacing:.08em;margin-bottom:3px;text-shadow:0 1px 3px #000}
#stats{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:min(250px,44vw);display:grid;gap:7px}
#hpBar i{background:var(--toxic)}#boostBar i{background:#62d3ff}#heatBar i{background:var(--accent)}
#top{position:absolute;top:max(12px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(420px,56vw);text-align:center;display:grid;gap:4px}
#waveLbl{font:400 clamp(17px,2.4vw,24px)/1 var(--display);text-shadow:0 2px 0 #000}
#coreBar i{background:#7fe9ff}
#bossBox{display:grid;gap:3px}#bossBar{height:16px}#bossBar i{background:#ff4040}#bossName{font:400 16px/1 var(--display);text-shadow:0 2px 0 #000}
#scoreBox{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(max(12px,env(safe-area-inset-top,0px)) + 40px);text-align:right;font:700 30px/1 var(--mono);text-shadow:0 2px 0 #000;font-variant-numeric:tabular-nums}
#scoreBox small{display:block;font-size:14px;color:var(--accent);margin-top:3px}
#rocketBox{position:absolute;left:calc(max(16px,env(safe-area-inset-left,0px)) + min(250px,44vw) + 16px);bottom:max(16px,env(safe-area-inset-bottom,0px));font:700 15px/1.2 var(--mono);text-shadow:0 1px 3px #000}
#rocketBox b{display:block;font:400 26px/1 var(--display);color:var(--accent)}
#radar{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:128px;height:128px}
@media (pointer:coarse){#radar{bottom:auto;top:calc(max(12px,env(safe-area-inset-top,0px)) + 90px);width:92px;height:92px}#rocketBox{bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 92px);left:max(16px,env(safe-area-inset-left,0px))}}
#xh{position:absolute;left:50%;top:50%;width:0;height:0}
#xh i{position:absolute;background:var(--paper);box-shadow:0 0 2px #000}
#xh .u,#xh .d{width:2px;height:10px;left:-1px}#xh .l,#xh .r{width:10px;height:2px;top:-1px}
#xh .dot{width:3px;height:3px;left:-1.5px;top:-1.5px;background:var(--accent)}
#xh.on i{background:#ff4a3a}
#hm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;background:linear-gradient(45deg,transparent 46%,#fff 46%,#fff 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fff 46%,#fff 54%,transparent 54%);-webkit-mask:radial-gradient(circle,transparent 42%,#000 44%);mask:radial-gradient(circle,transparent 42%,#000 44%)}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font:400 clamp(34px,7vw,84px)/1 var(--display);color:var(--paper);text-shadow:.05em .05em 0 var(--ink);opacity:0}
#banner small{display:block;font:700 clamp(14px,2vw,20px)/1.4 var(--mono);color:var(--accent);letter-spacing:.14em}
#choose{justify-content:center}
#cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(780px,100%)}
.card{appearance:none;border:0;text-align:left;background:var(--paper);color:var(--ink);padding:16px;cursor:pointer;display:grid;gap:6px;align-content:start;transition:transform .14s cubic-bezier(.2,1.6,.4,1);animation:slam .35s both;font:400 14px/1.45 var(--body);min-width:0}
.card b{font:400 clamp(18px,2.5vw,24px)/1.1 var(--display);color:#b4480a}
.card:hover{transform:translateY(-6px) rotate(-1deg)}
@media (max-width:620px){#cards{grid-template-columns:1fr}}
</style>

    <div id="bossBox" hidden><div id="bossName"></div><div class="bar" id="bossBar"><i></i></div></div></div>

<script>
/*COREJS*/
/* ───── 강철 수호 ───── */
const ARENA=78,boxes=[];
const SUN=new V(-.75,.2,-.62);
scene.fog=new THREE.FogExp2(0xd98a58,.0052);
skyDome(0x2c2f5e,0xd9774a,0xffb765,SUN,0xffe2a8,.8);
const hemi=new THREE.HemisphereLight(0xffd8b0,0x7a5240,1.9);scene.add(hemi);const fill=new THREE.DirectionalLight(0x9db4e0,1.1);fill.position.set(.7,.5,.7);scene.add(fill);
const sun=new THREE.DirectionalLight(0xffc48a,3.1);sun.castShadow=true;sun.shadow.mapSize.set(1536,1536);const sc=sun.shadow.camera;sc.left=-60;sc.right=60;sc.top=60;sc.bottom=-60;sc.near=10;sc.far=400;sun.shadow.bias=-.0006;scene.add(sun,sun.target);

const sandTex=noiseTex(512,(g,s)=>{g.fillStyle='#c98a56';g.fillRect(0,0,s,s);for(let i=0;i<14000;i++){g.fillStyle=`rgba(${rnd()<.5?'90,50,30':'255,215,160'},${rnd(.03,.1)})`;g.fillRect(rnd(s),rnd(s),rnd(1,3),rnd(1,3))}for(let i=0;i<46;i++){g.strokeStyle=`rgba(110,65,38,${rnd(.04,.11)})`;g.lineWidth=rnd(1,4);g.beginPath();const y=rnd(s);g.moveTo(0,y);g.bezierCurveTo(s*.3,y+rnd(-30,30),s*.7,y+rnd(-30,30),s,y);g.stroke()}},70,70);
const ground=new THREE.Mesh(new THREE.CircleGeometry(620,48),new THREE.MeshStandardMaterial({map:sandTex,roughness:1,metalness:0}));ground.rotation.x=-PI/2;ground.receiveShadow=true;scene.add(ground);
/* 멀리 있는 메사 */
for(let k=0;k<3;k++){
  const pts=[],n=96,r=[300,420,560][k],col=[0x9a5a42,0x8e5a58,0x8a6176][k],idx=[];
  for(let i=0;i<=n;i++){const a=i/n*TAU,x=cos(a)*r,z=sin(a)*r;const h=(18+k*22)*(.55+.45*sin(a*7+k*3)+.3*sin(a*17+k)+(sin(a*3+k)>.25?.7:0));pts.push(x,-2,z,x*.97,max(4,h),z*.97);if(i<n){const q=i*2;idx.push(q,q+2,q+1,q+1,q+2,q+3)}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));g.setIndex(idx);g.computeVertexNormals();
  scene.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:col,roughness:1,flatShading:true,side:THREE.DoubleSide})));
}
/* 지형지물 */
const conc=mat(0x8b7d6c),rust=mat(0x74452c,{metalness:.5}),dark=mat(0x4b4e58,{metalness:.35,roughness:.6}),hazard=mat(0xd99a26);
function block(x,z,hw,hd,h,m=conc,rot=false){const q=box(m,scene,x,h/2,z,hw*2,h,hd*2);q.receiveShadow=true;boxes.push({x,z,hw,hd,h});return q}
function crate(x,z){block(x,z,1.5,1.5,2.6,rust);box(hazard,scene,x,2.65,z,3.05,.14,.5)}
const rs=[[-22,-20],[24,-18],[-26,20],[22,26],[-46,4],[46,-6],[6,-48],[-8,50],[-44,-40],[44,42],[42,-44],[-42,44]];
rs.forEach(([x,z],i)=>{if(i%3===0){block(x,z,5,1.1,3.2);block(x+3,z+4,1.1,3,3.2)}else if(i%3===1){crate(x,z);crate(x+3.4,z+.5);crate(x+1.5,z+3.3)}else{block(x,z,1.1,5,2.8);crate(x+3,z-2)}});
/* 경계 울타리 */
for(let i=0;i<48;i++){const a=i/48*TAU;if(abs(wrapA(a*4))<.12)continue;const q=box(dark,scene,cos(a)*ARENA,1.5,sin(a)*ARENA,.5,3,.5);q.castShadow=false;if(i%2===0){const w=box(rust,scene,cos(a+TAU/96)*ARENA,1.2,sin(a+TAU/96)*ARENA,10,.2,.12,false);w.rotation.y=-(a+TAU/96)+PI/2}}
/* 적 출현 관문 */
const gates=[0,PI/2,PI,-PI/2].map(a=>{const x=cos(a)*ARENA,z=sin(a)*ARENA,g=pivot(scene,x,0,z);g.rotation.y=-a+PI/2;box(dark,g,-7,6,0,1.6,12,1.6);box(dark,g,7,6,0,1.6,12,1.6);box(dark,g,0,12,0,16,1.6,1.6);const w=new THREE.Mesh(new THREE.TorusGeometry(5.2,.22,8,36),glowMat(0x7dff5a));w.position.y=6;g.add(w);return{x,z,a,w}});
/* 반응로 */
const CORE={hp:1,max:1,g:pivot(scene,0,0,0),fl:0};
const coreGlow=glowMat(0x7fe9ff);
cyl(dark,CORE.g,0,1.2,0,6.2,2.4);cyl(conc,CORE.g,0,3.4,0,4.4,2);
for(let i=0;i<4;i++){const a=i/4*TAU+PI/4,q=box(hazard,CORE.g,cos(a)*5.4,1.4,sin(a)*5.4,1.2,2.8,1.2)}
const coreBall=sph(coreGlow,CORE.g,0,8.6,0,2.5,2.5,2.5,false);
const coreRings=[0,1,2].map(i=>{const q=new THREE.Mesh(new THREE.TorusGeometry(3.6+i*.7,.16,8,48),dark);q.position.y=8.6;CORE.g.add(q);return q});
const coreLight=new THREE.PointLight(0x7fe9ff,260,50,1.8);coreLight.position.y=9;CORE.g.add(coreLight);
for(let i=0;i<3;i++){const a=i/3*TAU,q=box(dark,CORE.g,cos(a)*3.6,7,sin(a)*3.6,.5,6,.5)}
boxes.push({x:0,z:0,hw:4.6,hd:4.6,h:13});

/* 플레이어 메카 */
const mHull=mat(0xd6cdb9,{metalness:.35,roughness:.55}),mTrim=mat(0xd2541f,{metalness:.3}),mDark=mat(0x5a5f6a,{metalness:.4,roughness:.5});
const P={x:0,y:0,z:22,vx:0,vy:0,vz:0,hp:100,max:100,boost:1,heat:0,over:0,rockets:3,rocketT:0,dashT:0,dashCd:0,inv:0,ph:0,amt:0,legYaw:0,kick:0,side:1,alive:true,hover:false,onG:true,shotT:0,g:new THREE.Group()};
scene.add(P.g);
const legsG=pivot(P.g,0,0,0),torso=pivot(P.g,0,2.5,0);
function mkLeg(sx){
  const hip=pivot(legsG,sx*.62,2.3,0);box(mHull,hip,0,-.5,0,.5,1.1,.62);box(mTrim,hip,sx*.3,-.45,0,.1,.7,.4);
  const knee=pivot(hip,0,-1.02,.02);box(mDark,knee,0,-.48,.06,.42,1,.5);box(mHull,knee,0,-.1,-.26,.48,.42,.2);
  const foot=pivot(knee,0,-1.05,0);box(mDark,foot,0,-.12,-.16,.6,.26,1.15);return{hip,knee,foot,sx}
}
const legL=mkLeg(-1),legR=mkLeg(1);
box(mDark,torso,0,-.18,0,1.3,.5,.9);box(mHull,torso,0,.55,0,1.9,1.2,1.25);box(mTrim,torso,0,.55,-.66,.8,.75,.1);box(mHull,torso,0,1.25,-.1,1.25,.42,.95);
const head=pivot(torso,0,1.65,-.1);box(mHull,head,0,0,0,.72,.5,.72);box(glowMat(0x7fe9ff),head,0,.03,-.38,.5,.12,.06,false);box(mDark,head,.28,.42,.1,.05,.5,.05,false);
box(mDark,torso,0,.6,.82,1.2,1,.5);
const armL=pivot(torso,-1.25,.9,0),armR=pivot(torso,1.25,.9,0);
for(const[a,s]of[[armL,-1],[armR,1]]){box(mHull,a,s*.08,.14,0,.72,.6,.82);box(mDark,a,0,-.4,-.1,.4,.8,.42);const gun=box(mDark,a,0,-.72,-.72,.32,.32,1.5);box(mTrim,a,0,-.72,-1.15,.36,.36,.16);a.muzzle=new V(s*1.25,.18+2.5,-1.6)}
const pod=pivot(torso,-1.35,1.5,.1);box(rust,pod,0,0,0,.75,.55,1.1);for(const dx of[-.17,.17])for(const dy of[-.11,.11])cyl(mDark,pod,dx,dy,-.56,.11,.05,.11,false).rotation.x=PI/2;
const nozL=sph(glowMat(0x62d3ff),torso,-.42,.3,1.12,.2,.2,.3,false),nozR=sph(glowMat(0x62d3ff),torso,.42,.3,1.12,.2,.2,.3,false);
const muzL=new THREE.PointLight(0xffd080,0,16,2);P.g.add(muzL);muzL.position.set(0,3,-2.4);
const muzzleSprite=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:0xffd080,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide,toneMapped:false,map:noiseTex(64,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,1,s/2,s/2,s/2);r.addColorStop(0,'#fff');r.addColorStop(.3,'#ffcf80');r.addColorStop(1,'rgba(255,120,30,0)');g.fillRect(0,0,s,s);g.clearRect(0,0,s,s);g.fillStyle=r;for(let i=0;i<6;i++){g.save();g.translate(s/2,s/2);g.rotate(i/6*TAU);g.beginPath();g.moveTo(0,-5);g.lineTo(s/2,0);g.lineTo(0,5);g.fill();g.restore()}g.beginPath();g.arc(s/2,s/2,s*.2,0,TAU);g.fill()})}));
muzzleSprite.visible=false;scene.add(muzzleSprite);

/* 강화 값과 상태 */
let U,S={wave:0,kills:0,score:0,shown:0,state:'idle',t:0,queue:[],spawnT:0,boss:null,turretT:0,chain:0,chainT:0};
const resetU=()=>{U={dmg:1,rate:1,spread:0,rocketCd:7,rocketR:9,rocketN:1,turrets:0,armor:1,dashCd:1.3,cool:1}};resetU();
const foes=[],foePool={},pShots=[],eShots=[],rocks=[],mortars=[];

const timers=[],later=(t,f)=>timers.push({t,f});
function updTimers(dt){for(let i=timers.length-1;i>=0;i--){const q=timers[i];q.t-=dt;if(q.t<=0){timers.splice(i,1);q.f()}}}
/* 탄 풀 */
const shotGeo=new THREE.BoxGeometry(.1,.1,2.6),shotMat=new THREE.MeshBasicMaterial({color:0xfff0b0,toneMapped:false});
const shotPool=[];function getShot(){let q=shotPool.pop();if(!q){q=new THREE.Mesh(shotGeo,shotMat);scene.add(q)}q.visible=true;return q}
const eGeo=new THREE.SphereGeometry(.42,10,8),eMat=new THREE.MeshBasicMaterial({color:0x9dff7a,toneMapped:false}),ePool=[];
function getE(){let q=ePool.pop();if(!q){q=new THREE.Mesh(eGeo,eMat);scene.add(q)}q.visible=true;return q}

/* 적 모형 */
const fDark=mat(0x383c47,{metalness:.45,roughness:.45}),fMid=mat(0x5c616e,{metalness:.4,roughness:.5}),fEye=glowMat(0x7dff5a);
const DEF={
  crawler:{hp:22,r:1.2,h:.9,sp:12,score:60},
  walker:{hp:60,r:1.3,h:2.2,sp:6.5,score:140},
  flyer:{hp:34,r:1.3,h:0,sp:13,score:160},
  tank:{hp:210,r:2.6,h:1.6,sp:3.6,score:420}
};
function buildFoe(type){
  const g=new THREE.Group(),m=fDark.clone(),e={g,m,legs:[],parts:{}};
  if(type==='crawler'){
    sph(m,g,0,.85,0,1,.55,1.25);sph(fEye,g,0,.95,-1.05,.25,.2,.2,false);sph(fEye,g,0,1.35,.25,.32,.32,.32,false);
    for(let i=0;i<6;i++){const s=i<3?-1:1,z=((i%3)-1)*.65,p=pivot(g,s*.7,.8,z);box(fMid,p,s*.55,-.1,0,1.2,.13,.14,false);const q=pivot(p,s*1.1,-.12,0);box(fMid,q,0,-.38,0,.13,.85,.13,false);e.legs.push({p,s,i})}
  }else if(type==='walker'){
    const body=pivot(g,0,2.4,0);box(m,body,0,.2,0,1.5,1.1,1.1);box(fMid,body,0,.9,-.1,.72,.46,.72);box(fEye,body,0,.92,-.48,.5,.1,.05,false);
    e.parts.gun=box(fMid,body,.95,.15,-.75,.3,.3,1.9);box(fMid,body,-.95,.25,0,.4,.75,.5);e.parts.body=body;
    for(const s of[-1,1]){const hip=pivot(g,s*.45,1.95,0);box(m,hip,0,-.5,0,.34,1.05,.42);const kn=pivot(hip,0,-1,0);box(fMid,kn,0,-.45,.05,.28,.95,.36);e.legs.push({hip,kn,s})}
  }else if(type==='flyer'){
    const q=sph(m,g,0,0,0,1.25,.42,1.25);sph(fEye,g,0,-.22,-.72,.3,.22,.3,false);e.parts.rotor=new THREE.Mesh(new THREE.TorusGeometry(1.75,.1,6,22),fEye);e.parts.rotor.rotation.x=PI/2;g.add(e.parts.rotor);
    for(let i=0;i<3;i++){const a=i/3*TAU;box(fMid,g,cos(a)*1.2,0,sin(a)*1.2,.15,.08,1.2,false).rotation.y=-a}
  }else if(type==='tank'){
    box(m,g,0,1,0,3.6,1.1,5);for(const s of[-1,1])box(fMid,g,s*2.1,.75,0,.9,1.5,5.6);
    const t=pivot(g,0,1.9,.2);box(m,t,0,.3,0,2.4,.9,2.8);e.parts.barrel=box(fMid,t,0,.65,-2.2,.4,.4,3.4);box(fEye,t,.8,.5,-1.42,.3,.2,.05,false);e.parts.turret=t;
  }
  return e;

    if(b.atk<=0){b.atk=phase?3:4.4;for(let i=0;i<(phase?10:7);i++)later(i*.13,()=>{if(Game.mode==='play'&&b.alive){mortar(P.x+rnd(-11,11)+P.vx*.4,P.z+rnd(-11,11)+P.vz*.4,12,4.2,1.3);fxA.emit(b.x,18,b.z,0,10,0,1,.3,.4,1,.3)}})}
    if(b.atk2<=0&&!b.sweep){b.atk2=phase?6.5:9;b.sweep={t:0,tel:1.2,dur:2.4,a0:toP+1.15*(rnd()<.5?1:-1),dir:0,r:hypot(P.x-b.x,P.z-b.z)};b.sweep.dir=-sign(wrapA(b.sweep.a0-toP));Snd.alarm()}
    if(b.atk3<=0){b.atk3=10;for(let i=0;i<4;i++)spawnFoeAt('walker',b.x+rnd(-9,9),b.z+rnd(-9,9))}
    if(b.sweep){const q=b.sweep;q.t+=dt;const fired=q.t>q.tel,k=clamp((q.t-q.tel)/q.dur,0,1),a=q.a0+q.dir*2.3*k,hx=b.x-s*.2,hy=17.5,hz=b.z-c*.2,ex=b.x-sin(a)*q.r,ez=b.z-cos(a)*q.r;
      seg(beam,hx,hy,hz,ex,0,ez,fired?.9:.08);beam.visible=true;beam.material.opacity=fired?.95:.5+.4*sin(T.ui*30);
      if(fired){for(let i=0;i<3;i++)fxA.emit(ex+rnd(-1,1),.3,ez+rnd(-1,1),rnd(-5,5),rnd(3,9),rnd(-5,5),rnd(.5,1.2),.4,.6,1,.4);fxS.emit(ex,.5,ez,0,1,0,1.6,1,.12,.1,.1,.5,{grow:2});
        const ax=ex-hx,az=ez-hz,al=hypot(ax,az),tx=P.x-hx,tz=P.z-hz,pr=clamp((tx*ax+tz*az)/(al*al),0,1),pd=hypot(tx-ax*pr,tz-az*pr);if(pd<2.2&&P.y<lerp(hy,0,pr)+1&&P.y<7)hitMe(55*dt*2.2,ex,ez)}
      if(q.t>q.tel+q.dur){b.sweep=null;beam.visible=false}}
  }
}
function jumpStomp(b){Snd.alarm();telegraph(b.x,0,b.z,22,1.2);later(1.2,()=>{if(!b.alive||Game.mode!=='play')return;boom(b.x,1,b.z,3);shock(b.x,.05,b.z,4,24,.55,0xff6a3c);const d=hypot(P.x-b.x,P.z-b.z);if(d<22&&P.y<3)hitMe(24,b.x,b.z)})}
function spawnFoeAt(t,x,z){if(foes.length>40)return;const g={x,z,a:rnd(TAU)};spawnFoe(t,g)}

/* 카메라 */
let camD=8.2,fov=68;
function updCamera(dt){
  camDir();const y=In.yaw;
  const hx=P.x,hy=P.y+4.6,hz=P.z,sh=2.9*clamp(cam.aspect/1.3,.35,1);
  const tx=hx+ri.x*sh,tz=hz+ri.z*sh;
  const want=11,o=rayBoxes(tx,hy,tz,-fw.x,-fw.y,-fw.z,want+.5,boxes);
  camD=damp(camD,min(want,o-.5),o-.5<camD?30:5,dt);
  cam.position.set(tx-fw.x*camD,max(.6,hy-fw.y*camD),tz-fw.z*camD);
  cam.lookAt(cam.position.x+fw.x,cam.position.y+fw.y,cam.position.z+fw.z);
  const wantF=68+(P.dashT>0?12:0);if(abs(fov-wantF)>.05){fov=damp(fov,wantF,9,dt);cam.fov=fov;cam.updateProjectionMatrix()}
  sun.position.set(P.x+SUN.x*170,SUN.y*170+50,P.z+SUN.z*170);sun.target.position.set(P.x,0,P.z);
}
/* 환경 움직임 */
function updWorld(dt){
  coreRings[0].rotation.x+=dt*1.2;coreRings[1].rotation.y+=dt*1.7;coreRings[2].rotation.x-=dt*.9;coreRings[2].rotation.z+=dt*.8;
  CORE.fl=max(0,CORE.fl-dt*4);const k=CORE.hp,pu=1+sin(T.ui*(3+6*(1-k)))*.06;coreBall.scale.setScalar(2.5*pu);coreGlow.color.setRGB(lerp(1,.5,k)+CORE.fl*.5,lerp(.25,.91,k)+CORE.fl*.2,lerp(.2,1,k));coreLight.color.copy(coreGlow.color);coreLight.intensity=240+CORE.fl*500;
  gates.forEach((g,i)=>{g.w.rotation.z+=dt*(1.5+i*.2)});
  for(let i=0;i<3;i++){const x=P.x+rnd(-55,55),z=P.z+rnd(-55,55);if(rnd()<.35)fxS.emit(x,rnd(.2,2.4),z,rnd(4,9),rnd(0,.4),rnd(-1,1.6),rnd(1.5,3.6),rnd(1.4,3),.9,.65,.45,.14,{grow:2})}
}
/* HUD */
const elS={hp:$('hpBar').firstChild,boost:$('boostBar').firstChild,heat:$('heatBar').firstChild,core:$('coreBar').firstChild,boss:$('bossBar').firstChild};
const setBar=(el,v)=>{const s=`scaleX(${clamp(v,0,1).toFixed(3)})`;if(el._s!==s){el.style.transform=s;el._s=s}};
const rc=$('radar').getContext('2d');let hudFrame=0;
function updHUD(dt){
  setBar(elS.hp,P.hp/P.max);setBar(elS.boost,P.boost);setBar(elS.heat,P.heat);setBar(elS.core,CORE.hp);if(S.boss)setBar(elS.boss,S.boss.hp/S.boss.max);
  S.shown=abs(S.score-S.shown)<3?S.score:damp(S.shown,S.score,12,dt);$('score').textContent=round(S.shown).toLocaleString();
  $('left').textContent=S.chain>=5?`${S.chain}연속 · ×${1+min(4,floor(S.chain/10))}`:`남은 적 ${S.queue.length+foes.length+(S.boss&&S.boss.alive?1:0)}`;
  $('rockets').textContent=P.rockets;$('heatLbl').textContent=P.over>0?'과열 냉각 중':'포신 열';
  const xh=$('xh');xh.className=aim.on?'on':'';const sp=(In.fire?13:8)+P.heat*5+U.spread*3;if(xh._sp!==sp){xh._sp=sp;xh.querySelector('.u').style.top=-sp-10+'px';xh.querySelector('.d').style.top=sp+'px';xh.querySelector('.l').style.left=-sp-10+'px';xh.querySelector('.r').style.left=sp+'px'}
  if((hudFrame++)%3===0){
    rc.clearRect(0,0,128,128);rc.fillStyle='rgba(20,12,8,.5)';rc.beginPath();rc.arc(64,64,62,0,TAU);rc.fill();rc.strokeStyle='rgba(246,231,207,.5)';rc.lineWidth=2;rc.stroke();
    const c=cos(In.yaw),s=sin(In.yaw),sc=60/70,pt=(x,z)=>{const dx=x-P.x,dz=z-P.z;return[64+(dx*c-dz*s)*sc,64+(dx*s+dz*c)*sc]};
    const[a,b]=pt(0,0);rc.fillStyle='#7fe9ff';rc.beginPath();rc.arc(clamp(a,8,120),clamp(b,8,120),5,0,TAU);rc.fill();
    rc.fillStyle='#ff5a48';for(const e of foes){const[x,y]=pt(e.x,e.z);if(hypot(x-64,y-64)<60)rc.fillRect(x-1.5,y-1.5,3,3)}
    if(S.boss){const[x,y]=pt(S.boss.x,S.boss.z);rc.beginPath();rc.arc(clamp(x,8,120),clamp(y,8,120),6,0,TAU);rc.fill()}
    rc.fillStyle='#f6e7cf';rc.beginPath();rc.moveTo(64,57);rc.lineTo(59,69);rc.lineTo(69,69);rc.fill();
  }
}
/* 음악 */
Snd.bpm=138;Snd.noteFn=(i,w)=>{const prog=[40,40,43,38],root=prog[floor(i/16)%4],s=i%16;
  if([0,3,6,10,12].includes(s))Snd.tone('sawtooth',midi(root-12),midi(root-12),.18,.11,w);
  if(s%4===0)Snd.tone('sine',140,40,.16,.42,w);if(s%8===4)Snd.burst(.14,.15,2600,800,w,'bandpass');if(s%2===1)Snd.burst(.03,.04,9000,6000,w,'highpass');
  if(i%32===24)Snd.tone('square',midi(root+24),midi(root+19),.3,.025,w);if(s===14)Snd.tone('square',midi(root+12),midi(root+12),.14,.03,w)};

/* 시작 */
function clearAll(){
  timers.length=0;

}
function resetPlayer(){Object.assign(P,{x:0,y:0,z:20,vx:0,vy:0,vz:0,hp:100,max:100,boost:1,heat:0,over:0,rockets:3,rocketT:0,dashT:0,dashCd:0,inv:0,alive:true,amt:0});P.g.visible=true;In.yaw=0;In.pitch=.05;P.legYaw=0}

setPads([{id:'jump',label:'점프'},{id:'dash',label:'대시'},{id:'rocket',label:'로켓'},{id:'fire',label:'발사',main:true}]);
let attract=0;
bootGame('steel-guard',{
  start(){clearAll();resetU();resetPlayer();Object.assign(S,{wave:0,kills:0,score:0,shown:0,state:'idle',t:0,queue:[],chain:0,chainT:0,coreDown:false});CORE.hp=1;Snd.bpm=138;$('hud').hidden=false;$('bossBox').hidden=true;nextWave()},

  }
});
if(DEBUG)window.__t={S,P,U,foes,CORE,In,nextWave,chooseUp,UPG,hurtBoss};
