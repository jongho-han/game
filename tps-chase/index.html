<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>협곡 추격</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Rajdhani:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 레이아웃: 속도계가 중심인 레이싱 포스터. 기울인 표제, 하단 중앙 계기판. */
:root{--ink:#190b1e;--paper:#fff4e0;--accent:#35f0d0;--hot:#ff5b3a;--sun:#ffc23d;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--mono:"Rajdhani","IBM Plex Sans KR",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--paper);font:400 15px/1.55 var(--body);-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:0}
#hud{position:fixed;inset:0;pointer-events:none;
  padding-block:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#floats,#hitdir,#flash,#vig{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5))}
#flash{opacity:0}
.fl{position:absolute;left:0;top:0;font:700 18px/1 var(--mono);color:var(--paper);text-shadow:0 2px 0 rgba(0,0,0,.7);white-space:nowrap;will-change:transform,opacity}
.fl.crit{color:var(--accent);font-size:26px}
.fl.big{font:400 34px/1 var(--display);color:var(--accent)}
.arrow{position:absolute;left:50%;top:50%;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:38px solid rgba(255,50,40,.85);margin:-19px 0 0 -26px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:clamp(10px,2.4vh,22px);overflow:auto;
  padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));
  padding-left:max(clamp(16px,7vw,110px),env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dim{background:linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.45) 55%,rgba(0,0,0,.1));animation:fade .3s both}
.eyebrow{font:700 clamp(12px,1.6vw,15px)/1.2 var(--mono);letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin:0}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.big{font-size:min(14vw,20vh,140px);line-height:1;animation:slam .5s cubic-bezier(.2,1.5,.4,1) both}
.lead{margin:0;max-width:34em;font-size:clamp(14px,1.8vw,17px);text-shadow:0 1px 8px #000}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,max-content));gap:6px 20px;margin:0;font-size:13px;max-width:min(100%,780px)}
.keys div{display:flex;flex-direction:column;gap:2px;min-width:0}
.keys dt{font:700 12px/1.2 var(--mono);color:var(--accent);letter-spacing:.03em}
.keys dd{margin:0;text-shadow:0 1px 6px #000}
.go{appearance:none;border:0;background:var(--accent);color:var(--ink);font:400 clamp(22px,3.2vw,30px)/1 var(--display);padding:.6em 1.4em;cursor:pointer;transition:transform .15s cubic-bezier(.2,1.6,.4,1),filter .15s}
.go:hover{transform:translateX(8px);filter:brightness(1.15)}
.go:active{transform:translateX(12px) scale(.97)}
.go.alt{background:var(--paper);color:var(--ink)}
:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.row-btn{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.best{font:700 14px/1.2 var(--mono);margin:0}
.best b{color:var(--accent);font-size:18px;font-variant-numeric:tabular-nums}
.tally{display:grid;grid-template-columns:auto auto;gap:4px 28px;margin:0;font:700 clamp(15px,2.2vw,20px)/1.35 var(--mono);font-variant-numeric:tabular-nums}
.tally dt{color:var(--accent);font-weight:500}.tally dd{margin:0;text-align:right}
#stamp{display:inline-block;font:400 clamp(18px,3vw,26px)/1 var(--display);color:var(--ink);background:var(--accent);padding:.35em .6em;transform:rotate(-5deg)}
.tool{position:fixed;display:flex;gap:8px;right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));z-index:5}
.tool button{appearance:none;border:2px solid rgba(255,255,255,.45);background:rgba(0,0,0,.45);color:var(--paper);font:700 12px/1 var(--mono);height:32px;min-width:42px;padding:0 9px;cursor:pointer}
.tool button:hover{background:var(--paper);color:var(--ink)}
#pads{position:fixed;display:none;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));gap:10px;flex-wrap:wrap-reverse;justify-content:flex-end;width:190px}
#pads button{appearance:none;border:3px solid var(--paper);border-radius:50%;width:70px;height:70px;background:rgba(0,0,0,.35);color:var(--paper);font:400 15px/1 var(--display);touch-action:none}
#pads button.main{width:84px;height:84px;background:color-mix(in srgb,var(--accent) 45%,transparent)}
#stickBase{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border:3px solid rgba(255,255,255,.5);border-radius:50%;pointer-events:none}
#stickKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.6)}
@media (pointer:coarse){#pads.on{display:flex}.keys{display:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slam{from{transform:scale(1.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.big,.dim{animation:none}.go{transition:none}}
#cv{z-index:0}#vig,#flash,#hitdir,#floats{z-index:1}#hud{z-index:2}.screen{z-index:4}.tool,#pads,#stickBase{z-index:5}

#menu{background:linear-gradient(90deg,rgba(25,11,30,.65),rgba(25,11,30,0) 62%)}
#logo{font-size:min(17vw,25vh,190px);line-height:.92;color:var(--paper);transform:skewX(-10deg);transform-origin:0 100%;text-shadow:.05em .05em 0 var(--hot)}
#logo em{font-style:normal;display:block;margin-left:.5em;color:var(--accent);text-shadow:.05em .05em 0 var(--ink)}
.go{transform:skewX(-10deg)}.go:hover{transform:skewX(-10deg) translateX(8px)}.go:active{transform:skewX(-10deg) translateX(12px) scale(.97)}
#speedo{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%) skewX(-10deg);display:grid;justify-items:center;gap:3px;text-shadow:0 2px 0 rgba(0,0,0,.6)}
#spd{font:700 clamp(34px,6vw,58px)/.9 var(--mono);font-variant-numeric:tabular-nums}#spd small{font-size:.38em;margin-left:4px;color:var(--accent)}
.bar{width:min(280px,46vw);height:9px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.4)}.bar i{display:block;height:100%;transform-origin:0 50%;background:var(--paper)}
#boostBar i{background:var(--accent)}#hpBar i{background:var(--hot)}
#scoreBox{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(14px,env(safe-area-inset-top,0px));font:700 34px/1 var(--mono);text-shadow:0 2px 0 rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
#scoreBox small{display:block;font:700 15px/1.3 var(--mono);color:var(--accent)}
#mult{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(max(14px,env(safe-area-inset-top,0px)) + 66px);font:400 28px/1 var(--display);color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.6)}
#bossBox{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(440px,52vw);display:grid;gap:4px;text-align:center}
#bossBox .bar{width:100%;height:13px}#bossBar i{background:var(--hot)}#bossName{font:400 18px/1 var(--display);text-shadow:0 2px 0 #000}
#xh{position:absolute;left:0;top:0;width:42px;height:42px;margin:-21px;border:2px solid var(--paper);border-radius:50%;box-shadow:0 0 3px #000}
#xh::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--paper)}
#xh.lock{border-color:var(--sun);border-style:dashed}
#locks{position:fixed;inset:0;pointer-events:none;z-index:1}
.lk{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px;border:3px solid var(--sun);transform-origin:50% 50%}
#lockN{position:absolute;left:50%;top:60%;transform:translateX(-50%);font:700 18px/1 var(--mono);color:var(--sun);text-shadow:0 2px 0 #000}
#banner{position:absolute;left:0;right:0;top:24%;text-align:center;font:400 clamp(32px,7vw,84px)/1.05 var(--display);transform:skewX(-10deg);text-shadow:.05em .05em 0 var(--ink);opacity:0}
#banner small{display:block;font:700 clamp(14px,2vw,20px)/1.4 var(--mono);color:var(--accent);letter-spacing:.1em}
#lines{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
@media (pointer:coarse){#speedo{left:auto;right:auto;left:50%;bottom:auto;top:calc(max(14px,env(safe-area-inset-top,0px)) + 46px)}}
</style>

<section id="menu" class="screen" aria-label="시작 화면">
  <p class="eyebrow">Red Rift Run · Endless pursuit</p>
  <h1 id="logo">협곡<em>추격</em></h1>
  <p class="lead">훔친 호버바이크로 끝없는 협곡을 질주합니다. 약탈단을 쏘아 떨어뜨리고, 바위를 스치듯 피하고, 포함선을 격추하세요. 빠를수록 점수가 커집니다.</p>
  <dl class="keys">
    <div><dt>A·D / ←→</dt><dd>좌우 이동</dd></div>
    <div><dt>마우스</dt><dd>조준, 왼쪽 클릭 사격</dd></div>
    <div><dt>오른쪽 클릭 유지 / F</dt><dd>적을 훑어 잠금, 놓으면 유도탄 발사</dd></div>
    <div><dt>Shift 유지 / W</dt><dd>부스트 (점수 ×2)</dd></div>
    <div><dt>Q·E</dt><dd>구르기 회피 (잠깐 무적)</dd></div>
    <div><dt>Space</dt><dd>도약</dd></div>
  </dl>
  <div class="row-btn"><button id="start" class="go">질주 시작</button><p class="best">최고 기록 <b id="bestMenu">0</b></p></div>
</section>
<canvas id="lines" aria-hidden="true"></canvas>
<div id="locks"></div>
<div id="hud" hidden>
  <div id="xh"></div>
  <div id="scoreBox"><span id="score">0</span><small id="dist">0 m</small></div><div id="mult"></div>
  <div id="bossBox" hidden><div id="bossName"></div><div class="bar" id="bossBar"><i></i></div></div>
  <div id="speedo"><div id="spd">0<small>KM/H</small></div><div class="bar" id="boostBar"><i></i></div><div class="bar" id="hpBar"><i></i></div></div>
  <div id="lockN"></div><div id="banner"></div>
</div>
<canvas id="cv" tabindex="0" aria-label="게임 화면"></canvas>
<div id="vig"></div><div id="flash"></div><div id="hitdir"></div><div id="floats"></div>
<div id="stickBase" hidden><div id="stickKnob"></div></div>
<div id="pads"></div>
<div class="tool"><button id="btnPause" aria-label="일시정지" hidden>II</button><button id="btnMute" aria-label="소리 켜고 끄기">SND</button></div>
<section id="pause" class="screen dim" aria-label="일시정지" hidden>
  <p class="eyebrow">Paused</p><h2 class="big">일시정지</h2>
  <div class="row-btn"><button id="resume" class="go">계속하기</button><button id="quit" class="go alt">처음으로</button></div>
</section>
<section id="over" class="screen dim" aria-label="결과" hidden>
  <p class="eyebrow" id="overEye"></p><h2 class="big" id="overTitle"></h2>
  <dl class="tally" id="tally"></dl><span id="stamp" hidden>최고 기록 갱신</span>
  <div class="row-btn"><button id="again" class="go">다시 시작</button><button id="quit2" class="go alt">처음으로</button></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
"use strict";
/* ───── 공통 엔진: 수학, 렌더러, 효과, 소리, 입력, 화면 전환 ───── */
const TAU=Math.PI*2,{sin,cos,atan2,hypot,min,max,abs,floor,PI,sqrt,pow,round,sign}=Math;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt));
const wrapA=a=>{while(a>PI)a-=TAU;while(a<-PI)a+=TAU;return a};
const dampA=(a,b,k,dt)=>a+wrapA(b-a)*(1-Math.exp(-k*dt));
const $=id=>document.getElementById(id);
const DEBUG=location.hash==='#debug',RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function fatal(msg){const m=$('menu');if(m){m.querySelector('.lead').textContent=msg;const s=$('start');if(s)s.hidden=true}throw new Error(msg)}
if(!window.THREE)fatal('3D 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침하세요.');
const V=THREE.Vector3,C=hex=>new THREE.Color(hex);
let R;
try{R=new THREE.WebGLRenderer({canvas:$('cv'),antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:DEBUG})}
catch(e){fatal('이 브라우저에서는 WebGL을 쓸 수 없어 게임을 실행할 수 없습니다.')}
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(68,1,.1,1400);
let PR=min(devicePixelRatio||1,1.5),VW=1,VH=1;
function resize(){VW=innerWidth;VH=innerHeight;R.setPixelRatio(PR);R.setSize(VW,VH,false);cam.aspect=VW/VH;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* 시간 */
const T={ui:0,ts:1,hold:0,stop:0,trauma:0,flash:0,flashCol:''};
const shake=v=>{T.trauma=min(1,T.trauma+v*(RM?.25:1))};
const slowmo=(v,d)=>{T.ts=v;T.hold=d};
const hitstop=d=>{T.stop=max(T.stop,RM?0:d)};
function flash(col,a){const f=$('flash');f.style.background=col;f.getAnimations().forEach(x=>x.cancel());f.animate([{opacity:RM?a*.3:a},{opacity:0}],{duration:360,easing:'ease-out'})}

/* 입자: 정점 하나당 부드러운 원 하나 */
const PV=`attribute float size;attribute vec4 col;varying vec4 vC;uniform float uS;void main(){vC=col;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=min(size*uS/-mv.z,400.);gl_Position=projectionMatrix*mv;}`;
const PF=`varying vec4 vC;void main(){float d=length(gl_PointCoord-.5)*2.;float a=smoothstep(1.,.1,d);if(a<.01)discard;gl_FragColor=vec4(vC.rgb,vC.a*a);}`;
class Particles{
  constructor(n,additive){
    this.n=n;this.i=0;this.p=new Float32Array(n*3);this.c=new Float32Array(n*4);this.s=new Float32Array(n);
    this.v=new Float32Array(n*3);this.l=new Float32Array(n);this.m=new Float32Array(n);this.s0=new Float32Array(n);this.g=new Float32Array(n);this.gr=new Float32Array(n);this.dr=new Float32Array(n);this.a0=new Float32Array(n);
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(this.p,3));g.setAttribute('col',new THREE.BufferAttribute(this.c,4));g.setAttribute('size',new THREE.BufferAttribute(this.s,1));
    this.u={uS:{value:600}};
    this.mesh=new THREE.Points(g,new THREE.ShaderMaterial({uniforms:this.u,vertexShader:PV,fragmentShader:PF,transparent:true,depthWrite:false,blending:additive?THREE.AdditiveBlending:THREE.NormalBlending}));
    this.mesh.frustumCulled=false;this.mesh.renderOrder=5;scene.add(this.mesh);
  }
  emit(x,y,z,vx,vy,vz,size,life,r,g,b,a=1,o){
    const i=this.i;this.i=(i+1)%this.n;const i3=i*3,i4=i*4;
    this.p[i3]=x;this.p[i3+1]=y;this.p[i3+2]=z;this.v[i3]=vx;this.v[i3+1]=vy;this.v[i3+2]=vz;
    this.c[i4]=r;this.c[i4+1]=g;this.c[i4+2]=b;this.c[i4+3]=a;this.a0[i]=a;this.s[i]=size;this.s0[i]=size;this.l[i]=life;this.m[i]=life;
    this.g[i]=o&&o.g||0;this.gr[i]=o&&o.grow||0;this.dr[i]=o&&o.drag||0;
  }
  update(dt){
    for(let i=0;i<this.n;i++){
      if(this.l[i]<=0)continue;
      this.l[i]-=dt;const i3=i*3;
      if(this.l[i]<=0){this.s[i]=0;this.c[i*4+3]=0;continue}
      const d=this.dr[i]?Math.exp(-this.dr[i]*dt):1;
      this.v[i3]*=d;this.v[i3+1]=this.v[i3+1]*d-this.g[i]*dt;this.v[i3+2]*=d;
      this.p[i3]+=this.v[i3]*dt;this.p[i3+1]+=this.v[i3+1]*dt;this.p[i3+2]+=this.v[i3+2]*dt;
      const k=this.l[i]/this.m[i];this.c[i*4+3]=this.a0[i]*k;this.s[i]=this.s0[i]+this.gr[i]*(1-k);
    }
    const g=this.mesh.geometry;g.attributes.position.needsUpdate=true;g.attributes.col.needsUpdate=true;g.attributes.size.needsUpdate=true;
    this.u.uS.value=VH*R.getPixelRatio()/(2*Math.tan(cam.fov*PI/360));
  }
}
const fxA=new Particles(1600,true),fxS=new Particles(700,false);

/* 파편 */
const CHUNKS=160,chunkMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0x2a2a30,roughness:.8,metalness:.3,flatShading:true}),CHUNKS);
chunkMesh.frustumCulled=false;chunkMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(chunkMesh);
const chunks=[];for(let i=0;i<CHUNKS;i++)chunks.push({l:0,p:new V(),v:new V(),r:new V(),w:new V(),s:1});let chunkI=0;const dmy=new THREE.Object3D();
function chunk(x,y,z,sp,s){const q=chunks[chunkI];chunkI=(chunkI+1)%CHUNKS;q.l=rnd(.8,2);q.p.set(x,y,z);q.v.set(rnd(-sp,sp),rnd(.3,1.3)*sp,rnd(-sp,sp));q.w.set(rnd(-9,9),rnd(-9,9),rnd(-9,9));q.s=s}
function updChunks(dt,floorY=0){
  for(let i=0;i<CHUNKS;i++){const q=chunks[i];
    if(q.l>0){q.l-=dt;q.v.y-=24*dt;q.p.addScaledVector(q.v,dt);q.r.addScaledVector(q.w,dt);if(q.p.y<floorY+q.s*.3){q.p.y=floorY+q.s*.3;q.v.y*=-.35;q.v.x*=.6;q.v.z*=.6;q.w.multiplyScalar(.5)}}
    dmy.position.copy(q.p);dmy.rotation.set(q.r.x,q.r.y,q.r.z);const s=q.l>0?q.s*min(1,q.l*3):0;dmy.scale.set(s,s*.7,s);dmy.updateMatrix();chunkMesh.setMatrixAt(i,dmy.matrix);
  }
  chunkMesh.instanceMatrix.needsUpdate=true;
}

/* 고리와 바닥 경고 */
const ringGeo=new THREE.RingGeometry(.9,1,56),discGeo=new THREE.CircleGeometry(1,40);ringGeo.rotateX(-PI/2);discGeo.rotateX(-PI/2);
const rings=[];for(let i=0;i<14;i++){const m=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,toneMapped:false}));m.visible=false;m.renderOrder=4;scene.add(m);rings.push({m,l:0,max:1,r0:0,r1:1})}
let ringI=0;
function shock(x,y,z,r0,r1,life,col=0xffd9a0){const q=rings[ringI];ringI=(ringI+1)%rings.length;q.m.position.set(x,y+.1,z);q.m.material.color.set(col);q.l=q.max=life;q.r0=r0;q.r1=r1;q.m.visible=true;q.m.rotation.set(0,0,0)}

function rayBoxes(ox,oy,oz,dx,dy,dz,maxT,boxes){
  let best=maxT;

    const x0=b.x-b.hw,x1=b.x+b.hw,z0=b.z-b.hd,z1=b.z+b.hd,y0=b.y0||0,y1=b.h;
    if(abs(dx)<1e-6){if(ox<x0||ox>x1)continue}else{let a=(x0-ox)/dx,c=(x1-ox)/dx;if(a>c){const s=a;a=c;c=s}t0=max(t0,a);t1=min(t1,c);if(t0>t1)continue}
    if(abs(dz)<1e-6){if(oz<z0||oz>z1)continue}else{let a=(z0-oz)/dz,c=(z1-oz)/dz;if(a>c){const s=a;a=c;c=s}t0=max(t0,a);t1=min(t1,c);if(t0>t1)continue}

    if(t0<best)best=t0;
  }

}

function step(raw){
  T.ui+=raw;

  T.trauma=max(0,T.trauma-raw*1.6);

  if(T.hold>0)T.hold-=raw;else T.ts=damp(T.ts,1,5,raw);
